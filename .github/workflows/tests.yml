name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run checks and document sync
        shell: bash
        run: python -m pytest -rf --tb=short 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}
      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          { echo '### pytest (Python ${{ matrix.python-version }})'; echo '```'; tail -n 80 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
